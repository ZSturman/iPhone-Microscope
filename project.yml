name: iPhoneMicroscope
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_OPTIMIZATION_LEVEL: '-O'
targets:
  iPhoneMicroscope:
    type: application
    platform: macOS
    sources:
      - App
      - Sources/MicroscopeCore
      - Sources/CompanionLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.iPhoneMicroscope
        PRODUCT_NAME: iPhoneMicroscope
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YOURTEAMID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Microscope.entitlements
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Store.entitlements
          ENABLE_APP_SANDBOX: YES
    scheme:
      testTargets: []
  MicroscopeCamera:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - iPhoneCompanion
      - Sources/CompanionLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.iPhoneMicroscope.Camera
        PRODUCT_NAME: MicroscopeCamera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: YOURTEAMID
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iPhoneCompanion/Companion.entitlements
        INFOPLIST_FILE: iPhoneCompanion/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
